<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Chat-X"/>
  <meta name="theme-color" content="#534AB7"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icon-192.png"/>
  <title>Chat-X</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f0f13; color: #e8e8f0; height: 100dvh; display: flex; align-items: center; justify-content: center; overflow: hidden; }

    /* INSTALL BANNER */
    .install-banner {
      display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
      background: #1e1e2a; border-top: 1px solid #2a2a3a;
      padding: 12px 18px calc(12px + var(--safe-bottom));
      align-items: center; gap: 12px;
    }
    .install-banner.show { display: flex; }
    .install-banner .install-icon { font-size: 28px; }
    .install-banner .install-text { flex: 1; }
    .install-banner .install-text strong { font-size: 13px; color: #e8e8f0; display: block; }
    .install-banner .install-text span { font-size: 11px; color: #666; }
    .install-banner .install-btn { background: #534AB7; color: white; border: none; border-radius: 10px; padding: 8px 16px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; white-space: nowrap; }
    .install-banner .dismiss-btn { background: none; border: none; color: #555; cursor: pointer; font-size: 18px; padding: 4px; }

    /* PASSWORD SCREEN */
    .password-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100vw; height: 100dvh; padding: 20px; }
    .password-card { background: #16161e; border: 1px solid #2a2a3a; border-radius: 20px; padding: 36px 28px; width: 100%; max-width: 340px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .logo { font-size: 32px; font-weight: 800; color: #e8e8f0; letter-spacing: -1px; }
    .logo span { color: #7F77DD; }
    .logo-sub { font-size: 12px; color: #555; letter-spacing: 1px; text-transform: uppercase; margin-top: -10px; }
    .subtitle { font-size: 13px; color: #666; text-align: center; }
    .password-card input { width: 100%; font-size: 16px; padding: 12px 14px; border: 1px solid #2a2a3a; border-radius: 12px; background: #1e1e2a; color: #e8e8f0; outline: none; font-family: inherit; text-align: center; letter-spacing: 4px; transition: border-color 0.15s; }
    .password-card input:focus { border-color: #534AB7; }
    .password-card input::placeholder { letter-spacing: 0; color: #444; font-size: 14px; }
    .password-card button { width: 100%; padding: 13px; background: #534AB7; color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; transition: background 0.15s; }
    .password-card button:active { background: #3C3489; }
    .error-msg { font-size: 12px; color: #F0997B; display: none; text-align: center; }
    .error-msg.show { display: block; }
    .name-step { display: none; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
    .name-step.show { display: flex; }
    .name-step label { font-size: 13px; color: #888; }
    .name-step input { letter-spacing: 0; text-align: center; }

    /* APP */
    .app { display: none; width: 100vw; height: 100dvh; max-width: 980px; max-height: 780px; border-radius: 16px; overflow: hidden; border: 1px solid #2a2a3a; background: #16161e; box-shadow: 0 24px 80px rgba(0,0,0,0.6); }
    .app.show { display: flex; }
    .sidebar { width: 240px; min-width: 240px; border-right: 1px solid #2a2a3a; display: flex; flex-direction: column; background: #11111a; transition: transform 0.25s ease; }
    .sidebar-header { padding: 14px 16px; padding-top: calc(14px + var(--safe-top)); border-bottom: 1px solid #2a2a3a; display: flex; align-items: center; gap: 8px; }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #1D9E75; animation: pulse 2s infinite; flex-shrink: 0; }
    @keyframes pulse { 0%,100%{box-shadow:0 0 0 2px #9FE1CB44} 50%{box-shadow:0 0 0 5px #9FE1CB22} }
    .app-title { font-size: 16px; font-weight: 800; color: #e8e8f0; letter-spacing: -0.5px; }
    .app-title span { color: #7F77DD; }
    .conn-badge { margin-left: auto; font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600; }
    .conn-badge.online { background: #0F6E5622; color: #5DCAA5; border: 1px solid #0F6E5644; }
    .conn-badge.offline { background: #99220022; color: #F0997B; border: 1px solid #99220044; }
    .user-bar { padding: 10px 12px; border-bottom: 1px solid #2a2a3a; display: flex; align-items: center; gap: 8px; }
    .user-avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
    .user-info { flex: 1; min-width: 0; }
    .user-name { font-size: 13px; font-weight: 600; color: #e8e8f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .admin-badge { font-size: 9px; background: #534AB733; color: #7F77DD; border: 1px solid #534AB755; border-radius: 6px; padding: 1px 5px; font-weight: 700; }
    .rooms-section { flex: 1; overflow-y: auto; padding: 6px 0; }
    .section-label { font-size: 10px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: #444; padding: 8px 14px 4px; }
    .room-item { padding: 10px 14px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: background 0.1s; position: relative; }
    .room-item:hover, .room-item:active { background: #1e1e2a; }
    .room-item.active { background: #1e1e2a; border-left: 3px solid #534AB7; }
    .room-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
    .room-info { flex: 1; min-width: 0; }
    .room-name { font-size: 14px; font-weight: 600; color: #e8e8f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .room-preview { font-size: 11px; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .room-delete-btn { display: none; background: none; border: none; color: #993C1D; cursor: pointer; padding: 4px 6px; border-radius: 6px; font-size: 15px; }
    .room-item:hover .room-delete-btn.vis { display: flex; }
    .add-room-btn { margin: 8px 12px; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: #555; cursor: pointer; padding: 8px 10px; border-radius: 10px; border: 1px dashed #2a2a3a; background: none; transition: all 0.15s; width: calc(100% - 24px); font-family: inherit; }
    .add-room-btn:hover, .add-room-btn:active { background: #1e1e2a; color: #aaa; border-color: #444; }
    .share-tip { font-size: 10px; color: #444; padding: 8px 14px calc(8px + var(--safe-bottom)); border-top: 1px solid #2a2a3a; text-align: center; line-height: 1.6; }
    .chat-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .chat-header { padding: 12px 16px; padding-top: calc(12px + var(--safe-top)); border-bottom: 1px solid #2a2a3a; display: flex; align-items: center; gap: 10px; background: #13131c; }
    .back-btn { display: none; background: none; border: none; color: #aaa; cursor: pointer; font-size: 22px; padding: 2px 6px 2px 0; flex-shrink: 0; }
    .room-avatar-lg { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; flex-shrink: 0; }
    .room-title { font-size: 15px; font-weight: 700; color: #e8e8f0; }
    .room-meta { font-size: 11px; color: #555; margin-top: 1px; }
    .live-badge { margin-left: auto; font-size: 11px; color: #5DCAA5; background: #0F6E5622; border: 1px solid #0F6E5644; border-radius: 20px; padding: 3px 10px; font-weight: 600; white-space: nowrap; }
    .messages { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; -webkit-overflow-scrolling: touch; }
    .messages::-webkit-scrollbar { width: 4px; } .messages::-webkit-scrollbar-thumb { background: #2a2a3a; border-radius: 4px; }
    .date-div { text-align: center; font-size: 11px; color: #444; display: flex; align-items: center; gap: 8px; margin: 4px 0; }
    .date-div::before,.date-div::after { content:''; flex:1; border-top: 1px solid #2a2a3a; }
    .msg-group { display: flex; flex-direction: column; gap: 2px; }
    .msg-sender { font-size: 10px; font-weight: 700; color: #555; margin-bottom: 2px; padding-left: 34px; }
    .msg-sender.own { text-align: right; padding-left: 0; padding-right: 34px; }
    .msg-row { display: flex; align-items: flex-end; gap: 7px; position: relative; }
    .msg-row.own { flex-direction: row-reverse; }
    .msg-avatar { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; }
    .msg-bubble { max-width: 70%; padding: 9px 13px; border-radius: 18px; font-size: 14px; line-height: 1.5; background: #1e1e2a; color: #e8e8f0; border: 1px solid #2a2a3a; word-break: break-word; }
    .msg-bubble.own { background: #534AB7; color: white; border-color: transparent; border-bottom-right-radius: 4px; }
    .msg-bubble:not(.own) { border-bottom-left-radius: 4px; }
    .msg-time { font-size: 10px; color: #444; padding: 0 3px; align-self: flex-end; white-space: nowrap; }
    .msg-delete-btn { display: none; background: none; border: none; color: #993C1D; cursor: pointer; padding: 4px 6px; border-radius: 6px; font-size: 14px; align-self: center; }
    .msg-row:hover .msg-delete-btn.vis { display: flex; }
    .typing-row { min-height: 26px; display: flex; align-items: center; padding: 0 16px 4px; }
    .typing-text { font-size: 11px; color: #555; font-style: italic; }
    .input-area { padding: 10px 14px; padding-bottom: calc(10px + var(--safe-bottom)); border-top: 1px solid #2a2a3a; display: flex; align-items: flex-end; gap: 8px; background: #13131c; }
    .input-area textarea { flex: 1; font-size: 15px; border: 1px solid #2a2a3a; border-radius: 22px; padding: 10px 15px; resize: none; outline: none; background: #1e1e2a; color: #e8e8f0; min-height: 42px; max-height: 110px; line-height: 1.5; overflow-y: auto; transition: border-color 0.15s; font-family: inherit; -webkit-appearance: none; }
    .input-area textarea:focus { border-color: #534AB7; }
    .input-area textarea::placeholder { color: #444; }
    .send-btn { width: 42px; height: 42px; border-radius: 50%; background: #534AB7; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: white; font-size: 17px; transition: background 0.15s; -webkit-tap-highlight-color: transparent; }
    .send-btn:active { background: #3C3489; transform: scale(0.93); }
    .send-btn:disabled { background: #1e1e2a; color: #333; cursor: default; }
    .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #444; font-size: 14px; }
    .admin-panel { background: #0f0f13; border-top: 1px solid #2a2a3a; padding: 8px 14px; display: none; gap: 8px; flex-wrap: wrap; }
    .admin-panel.show { display: flex; }
    .admin-panel-title { font-size: 10px; font-weight: 700; color: #7F77DD; letter-spacing: 0.5px; text-transform: uppercase; width: 100%; margin-bottom: 2px; }
    .admin-btn { font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 8px; cursor: pointer; border: 1px solid #2a2a3a; background: #1e1e2a; color: #aaa; font-family: inherit; display: flex; align-items: center; gap: 5px; }
    .admin-btn:active { background: #2a2a3a; }
    .admin-btn.danger { border-color: #99220044; color: #F0997B; }
    .modal-overlay { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.7); align-items: flex-end; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal-box { background: #1e1e2a; border-radius: 20px 20px 0 0; border: 1px solid #2a2a3a; border-bottom: none; padding: 22px 22px calc(22px + var(--safe-bottom)); width: 100%; max-width: 500px; }
    .modal-box h3 { font-size: 16px; font-weight: 700; margin-bottom: 14px; color: #e8e8f0; }
    .modal-box p { font-size: 13px; color: #888; margin-bottom: 16px; line-height: 1.5; }
    .modal-box input { width: 100%; font-size: 15px; padding: 12px 14px; border: 1px solid #2a2a3a; border-radius: 12px; background: #16161e; color: #e8e8f0; outline: none; margin-bottom: 14px; font-family: inherit; }
    .modal-box input:focus { border-color: #534AB7; }
    .modal-actions { display: flex; gap: 10px; }
    .modal-actions button { flex: 1; font-size: 14px; font-weight: 700; padding: 12px; border-radius: 12px; cursor: pointer; border: 1px solid #2a2a3a; background: #16161e; color: #888; font-family: inherit; }
    .modal-actions button.primary { background: #534AB7; color: white; border-color: transparent; }
    .modal-actions button.danger { background: #7A2E14; color: #F0997B; border-color: transparent; }
    .toast { position: fixed; bottom: calc(70px + var(--safe-bottom)); left: 50%; transform: translateX(-50%); background: #2a2a3a; color: #e8e8f0; font-size: 13px; padding: 10px 20px; border-radius: 20px; z-index: 999; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; }
    .toast.show { opacity: 1; }

    /* MOBILE */
    @media (max-width: 650px) {
      body { align-items: flex-start; justify-content: flex-start; }
      .app { max-width: 100vw; max-height: 100dvh; border-radius: 0; border: none; box-shadow: none; position: relative; overflow: hidden; }
      .sidebar { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; border-right: none; }
      .sidebar.hidden { transform: translateX(-100%); pointer-events: none; }
      .chat-area { width: 100%; height: 100dvh; }
      .back-btn { display: flex !important; }
      .msg-bubble { max-width: 82%; }
      .msg-delete-btn.vis { display: flex !important; }
      .room-delete-btn.vis { display: flex !important; }
      .modal-overlay { align-items: flex-end; }
      .modal-box { border-radius: 20px 20px 0 0; }
    }

    /* DESKTOP */
    @media (min-width: 651px) {
      .modal-overlay { align-items: center; }
      .modal-box { border-radius: 16px; border-bottom: 1px solid #2a2a3a; max-width: 340px; padding: 24px; }
    }
  </style>
</head>
<body>

<!-- INSTALL BANNER -->
<div class="install-banner" id="install-banner">
  <div class="install-icon">💬</div>
  <div class="install-text">
    <strong>Install Chat-X</strong>
    <span>Add to home screen for app experience</span>
  </div>
  <button class="install-btn" id="install-btn">Install</button>
  <button class="dismiss-btn" id="dismiss-install"><i class="ti ti-x"></i></button>
</div>

<!-- PASSWORD SCREEN -->
<div class="password-screen" id="password-screen">
  <div class="password-card">
    <div class="logo">Chat<span>-X</span></div>
    <div class="logo-sub">Messenger</div>
    <div class="subtitle">Enter the password to join</div>
    <div id="pass-step" style="width:100%;display:flex;flex-direction:column;gap:10px">
      <input type="password" id="pass-input" placeholder="Enter password…" maxlength="30" autocomplete="off"/>
      <div class="error-msg" id="pass-error">Wrong password. Try again.</div>
      <button id="pass-btn">Enter Chat →</button>
    </div>
    <div class="name-step" id="name-step">
      <label>You're in! What's your name?</label>
      <input type="text" id="name-input" placeholder="Your name…" maxlength="20" autocomplete="off"/>
      <div class="error-msg" id="name-error">Please enter your name.</div>
      <button id="name-btn">Start Chatting 🚀</button>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div class="app" id="app">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="live-dot"></div>
      <span class="app-title">Chat<span>-X</span></span>
      <span class="conn-badge offline" id="conn-status">…</span>
    </div>
    <div class="user-bar" id="user-bar"></div>
    <div class="rooms-section" id="rooms-list"><div class="section-label">Rooms</div></div>
    <button class="add-room-btn" id="add-room-btn"><i class="ti ti-plus"></i> New room</button>
    <div class="share-tip">Share link + password <strong style="color:#7F77DD">404</strong> with friends!</div>
  </div>
  <div class="chat-area" id="chat-area">
    <div class="empty-state">
      <i class="ti ti-message-dots" style="font-size:48px;opacity:0.15"></i>
      <span>Select a room to start chatting</span>
    </div>
  </div>
</div>

<!-- NEW ROOM MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <h3>Create a new room</h3>
    <input id="new-room-input" placeholder="Room name…" maxlength="30"/>
    <div class="modal-actions">
      <button id="modal-cancel">Cancel</button>
      <button class="primary" id="modal-create">Create</button>
    </div>
  </div>
</div>

<!-- CONFIRM MODAL -->
<div class="modal-overlay" id="confirm-modal">
  <div class="modal-box">
    <h3 id="confirm-title">Are you sure?</h3>
    <p id="confirm-desc"></p>
    <div class="modal-actions">
      <button id="confirm-cancel">Cancel</button>
      <button class="danger" id="confirm-ok">Delete</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// Register Service Worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

// PWA Install prompt
let deferredPrompt = null;
const installBanner = document.getElementById('install-banner');
const installBtn = document.getElementById('install-btn');
const dismissBtn = document.getElementById('dismiss-install');

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  if (!localStorage.getItem('chatx_install_dismissed')) {
    setTimeout(() => installBanner.classList.add('show'), 2000);
  }
});

installBtn.addEventListener('click', async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    deferredPrompt = null;
    installBanner.classList.remove('show');
  }
});

dismissBtn.addEventListener('click', () => {
  installBanner.classList.remove('show');
  localStorage.setItem('chatx_install_dismissed', '1');
});
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, onValue, set, remove, off } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const ENTRY_PASSWORD = '404';
const ADMIN_PASSWORD = '1511';

const savedName = localStorage.getItem('chatx_name');
const savedAdmin = localStorage.getItem('chatx_admin') === 'true';
if (savedName) {
  document.getElementById('password-screen').style.display = 'none';
  document.getElementById('app').classList.add('show');
}

const firebaseConfig = {
  apiKey: "AIzaSyDliubo95VE1QDs2BLHSQYNOJXB1F18LB4",
  authDomain: "my-messenger-b2f6b.firebaseapp.com",
  databaseURL: "https://my-messenger-b2f6b-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "my-messenger-b2f6b",
  storageBucket: "my-messenger-b2f6b.firebasestorage.app",
  messagingSenderId: "607585559489",
  appId: "1:607585559489:web:7315aeb66f79cd96f34540"
};

const firebaseApp = initializeApp(firebaseConfig);
const db = getDatabase(firebaseApp);

const COLORS = ['#7F77DD','#1D9E75','#D85A30','#378ADD','#EF9F27','#D4537E'];
function getColor(name) { let h=0; for(let c of(name||'?'))h=((h<<5)-h)+c.charCodeAt(0); return COLORS[Math.abs(h)%COLORS.length]; }
function initials(name) { return (name||'?').trim().split(/\s+/).map(w=>w[0]).join('').toUpperCase().slice(0,2)||'?'; }
function formatTime(ts) { return new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }
function dateStr(ts) { return new Date(ts).toLocaleDateString([],{weekday:'long',month:'short',day:'numeric'}); }

let myName = localStorage.getItem('chatx_name') || '';
let isAdmin = localStorage.getItem('chatx_admin') === 'true';
let activeRoomId = null;
let roomsData = {};
let msgListenerRoom = null;

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function confirmAction(title, desc, onOk) {
  const m = document.getElementById('confirm-modal');
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-desc').textContent = desc;
  m.classList.add('open');
  document.getElementById('confirm-ok').onclick = () => { m.classList.remove('open'); onOk(); };
  document.getElementById('confirm-cancel').onclick = () => m.classList.remove('open');
}

// PASSWORD
const passInput = document.getElementById('pass-input');
const passBtn = document.getElementById('pass-btn');

if (savedName) { myName = savedName; isAdmin = savedAdmin; initApp(); }

passBtn.addEventListener('click', checkPassword);
passInput.addEventListener('keydown', e => { if(e.key==='Enter') checkPassword(); });

function checkPassword() {
  const val = passInput.value.trim();
  if (val === ENTRY_PASSWORD || val === ADMIN_PASSWORD) {
    if (val === ADMIN_PASSWORD) isAdmin = true;
    document.getElementById('pass-step').style.display = 'none';
    document.getElementById('name-step').classList.add('show');
    document.getElementById('pass-error').classList.remove('show');
    setTimeout(() => document.getElementById('name-input').focus(), 50);
  } else {
    document.getElementById('pass-error').classList.add('show');
    passInput.value = '';
  }
}

document.getElementById('name-btn').addEventListener('click', enterChat);
document.getElementById('name-input').addEventListener('keydown', e => { if(e.key==='Enter') enterChat(); });

function enterChat() {
  const name = document.getElementById('name-input').value.trim();
  if (!name) { document.getElementById('name-error').classList.add('show'); return; }
  myName = name;
  localStorage.setItem('chatx_name', myName);
  localStorage.setItem('chatx_admin', isAdmin ? 'true' : 'false');
  document.getElementById('password-screen').style.display = 'none';
  document.getElementById('app').classList.add('show');
  initApp();
}

function initApp() {
  const color = getColor(myName);
  document.getElementById('user-bar').innerHTML = `
    <div class="user-avatar" style="background:${color}22;color:${color}">${initials(myName)}</div>
    <div class="user-info"><div class="user-name">${myName}</div></div>
    ${isAdmin ? '<span class="admin-badge">ADMIN</span>' : ''}
    <button title="Switch account" onclick="window.logout()" style="margin-left:auto;background:none;border:none;color:#555;cursor:pointer;font-size:18px;padding:4px;border-radius:6px;">
      <i class="ti ti-logout"></i>
    </button>`;

  onValue(ref(db, '.info/connected'), snap => {
    const el = document.getElementById('conn-status');
    if (!el) return;
    el.textContent = snap.val() ? 'live' : 'offline';
    el.className = 'conn-badge ' + (snap.val() ? 'online' : 'offline');
  });

  onValue(ref(db, 'rooms'), snap => {
    const data = snap.val() || {};
    if (Object.keys(data).length === 0) {
      set(ref(db,'rooms/general'),{name:'General'});
      set(ref(db,'rooms/random'),{name:'Random'});
      set(ref(db,'rooms/gaming'),{name:'Gaming'});
    } else { roomsData = data; renderRooms(); }
  });

  document.getElementById('add-room-btn').addEventListener('click', () => {
    document.getElementById('new-room-input').value = '';
    document.getElementById('modal').classList.add('open');
    setTimeout(() => document.getElementById('new-room-input').focus(), 50);
  });
  document.getElementById('modal-cancel').addEventListener('click', () => document.getElementById('modal').classList.remove('open'));
  document.getElementById('modal-create').addEventListener('click', createRoom);
  document.getElementById('new-room-input').addEventListener('keydown', e => { if(e.key==='Enter') createRoom(); if(e.key==='Escape') document.getElementById('modal').classList.remove('open'); });
}

window.logout = function() { localStorage.removeItem('chatx_name'); localStorage.removeItem('chatx_admin'); location.reload(); };

function renderRooms() {
  const list = document.getElementById('rooms-list');
  list.innerHTML = '<div class="section-label">Rooms</div>';
  Object.entries(roomsData).forEach(([id, room]) => {
    const color = getColor(room.name);
    const div = document.createElement('div');
    div.className = 'room-item' + (id === activeRoomId ? ' active' : '');
    div.innerHTML = `
      <div class="room-avatar" style="background:${color}22;color:${color}">${initials(room.name)}</div>
      <div class="room-info">
        <div class="room-name">${room.name}</div>
        <div class="room-preview">${room.lastMsg||'No messages yet'}</div>
      </div>
      ${isAdmin ? `<button class="room-delete-btn vis" data-id="${id}" data-name="${room.name}"><i class="ti ti-trash"></i></button>` : ''}`;
    div.addEventListener('click', e => { if(e.target.closest('.room-delete-btn')) return; openRoom(id, room.name); });
    if (isAdmin) {
      div.querySelector('.room-delete-btn').addEventListener('click', e => {
        e.stopPropagation();
        confirmAction('Delete room?', `Delete "${room.name}" and all its messages?`, () => {
          remove(ref(db,'rooms/'+id)); remove(ref(db,'messages/'+id)); remove(ref(db,'typing/'+id));
          if (activeRoomId===id) { activeRoomId=null; document.getElementById('chat-area').innerHTML='<div class="empty-state"><i class="ti ti-message-dots" style="font-size:48px;opacity:0.15"></i><span>Select a room</span></div>'; }
          showToast('Room deleted.');
        });
      });
    }
    list.appendChild(div);
  });
}

function openRoom(id, name) {
  activeRoomId = id; renderRooms();
  if (window.innerWidth <= 650) {
    document.getElementById('sidebar').classList.add('hidden');
  }
  if (msgListenerRoom) { off(ref(db,'messages/'+msgListenerRoom)); off(ref(db,'typing/'+msgListenerRoom)); }
  msgListenerRoom = id;
  const color = getColor(name);
  const chatArea = document.getElementById('chat-area');
  chatArea.innerHTML = `
    <div class="chat-header">
      <button class="back-btn" id="back-btn"><i class="ti ti-arrow-left"></i></button>
      <div class="room-avatar-lg" style="background:${color}22;color:${color}">${initials(name)}</div>
      <div><div class="room-title">${name}</div><div class="room-meta">Live room</div></div>
      <span class="live-badge">● live</span>
    </div>
    <div class="messages" id="messages"></div>
    <div class="typing-row" id="typing-row"></div>
    ${isAdmin ? `<div class="admin-panel show"><div class="admin-panel-title"><i class="ti ti-shield"></i> Admin</div>
      <button class="admin-btn danger" id="clear-btn"><i class="ti ti-trash"></i> Clear messages</button>
      <button class="admin-btn danger" id="del-room-btn"><i class="ti ti-x"></i> Delete room</button>
    </div>` : ''}
    <div class="input-area">
      <textarea id="msg-input" placeholder="Message…" rows="1"></textarea>
      <button class="send-btn" id="send-btn" disabled><i class="ti ti-send"></i></button>
    </div>`;

  document.getElementById('back-btn').addEventListener('click', () => {
    document.getElementById('sidebar').classList.remove('hidden');
  });

  if (isAdmin) {
    document.getElementById('clear-btn').addEventListener('click', () => {
      confirmAction('Clear all messages?', `Delete all messages in "${name}"?`, () => { remove(ref(db,'messages/'+id)); showToast('Cleared.'); });
    });
    document.getElementById('del-room-btn').addEventListener('click', () => {
      confirmAction('Delete room?', `Delete "${name}" forever?`, () => {
        remove(ref(db,'rooms/'+id)); remove(ref(db,'messages/'+id)); remove(ref(db,'typing/'+id));
        activeRoomId=null;
        chatArea.innerHTML='<div class="empty-state"><i class="ti ti-message-dots" style="font-size:48px;opacity:0.15"></i><span>Select a room</span></div>';
        if(window.innerWidth<=650) document.getElementById('sidebar').classList.remove('hidden');
        showToast('Room deleted.');
      });
    });
  }

  const textarea = document.getElementById('msg-input');
  const sendBtn = document.getElementById('send-btn');
  textarea.addEventListener('input', () => {
    textarea.style.height='auto';
    textarea.style.height=Math.min(textarea.scrollHeight,110)+'px';
    sendBtn.disabled=!textarea.value.trim();
    updateTyping(textarea.value.trim().length>0);
  });
  textarea.addEventListener('keydown', e => { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doSend();} });
  sendBtn.addEventListener('click', doSend);

  onValue(ref(db,'messages/'+id), snap => {
    const msgs = Object.entries(snap.val()||{}).map(([k,v])=>({...v,_key:k})).sort((a,b)=>a.ts-b.ts);
    renderMessages(msgs,id);
    if(msgs.length>0) set(ref(db,'rooms/'+id+'/lastMsg'), msgs[msgs.length-1].sender+': '+msgs[msgs.length-1].text.slice(0,30));
  });

  onValue(ref(db,'typing/'+id), snap => {
    const key=myName.replace(/[.#$\[\]]/g,'_');
    const others=Object.entries(snap.val()||{}).filter(([k,v])=>k!==key&&v).map(([k])=>k);
    const row=document.getElementById('typing-row');
    if(row) row.innerHTML=others.length?`<span class="typing-text">${others.join(', ')} ${others.length===1?'is':'are'} typing…</span>`:'';
  });
}

let typingTimeout=null;
function updateTyping(isTyping) {
  if(!myName||!activeRoomId) return;
  const key=myName.replace(/[.#$\[\]]/g,'_');
  const tRef=ref(db,'typing/'+activeRoomId+'/'+key);
  if(isTyping){set(tRef,true);clearTimeout(typingTimeout);typingTimeout=setTimeout(()=>set(tRef,false),3000);}
  else set(tRef,false);
}

function doSend() {
  const textarea=document.getElementById('msg-input');
  const text=textarea?.value.trim();
  if(!text||!myName) return;
  push(ref(db,'messages/'+activeRoomId),{sender:myName,text,ts:Date.now()});
  textarea.value=''; textarea.style.height='auto';
  document.getElementById('send-btn').disabled=true;
  updateTyping(false);
}

function renderMessages(msgs,roomId) {
  const container=document.getElementById('messages');
  if(!container) return;
  const wasAtBottom = container.scrollHeight-container.scrollTop-container.clientHeight < 60;
  container.innerHTML='';
  if(!msgs.length){container.innerHTML='<div style="text-align:center;font-size:13px;color:#444;margin:auto">No messages yet. Say hello! 👋</div>';return;}
  let lastDate=null;
  msgs.forEach(msg=>{
    const ds=dateStr(msg.ts);
    if(ds!==lastDate){const d=document.createElement('div');d.className='date-div';d.textContent=ds;container.appendChild(d);lastDate=ds;}
    const isOwn=msg.sender===myName;
    const color=getColor(msg.sender);
    const group=document.createElement('div');group.className='msg-group';
    const senderDiv=document.createElement('div');senderDiv.className='msg-sender'+(isOwn?' own':'');senderDiv.textContent=msg.sender;group.appendChild(senderDiv);
    const row=document.createElement('div');row.className='msg-row'+(isOwn?' own':'');
    if(!isOwn){const av=document.createElement('div');av.className='msg-avatar';av.style.cssText=`background:${color}22;color:${color}`;av.textContent=initials(msg.sender);row.appendChild(av);}
    const bubble=document.createElement('div');bubble.className='msg-bubble'+(isOwn?' own':'');bubble.textContent=msg.text;row.appendChild(bubble);
    const time=document.createElement('div');time.className='msg-time';time.textContent=formatTime(msg.ts);row.appendChild(time);
    if(isAdmin&&msg._key){const delBtn=document.createElement('button');delBtn.className='msg-delete-btn vis';delBtn.innerHTML='<i class="ti ti-trash"></i>';delBtn.addEventListener('click',()=>{remove(ref(db,'messages/'+roomId+'/'+msg._key));showToast('Deleted.');});row.appendChild(delBtn);}
    if(isOwn){const av=document.createElement('div');av.className='msg-avatar';av.style.cssText=`background:#534AB733;color:#7F77DD`;av.textContent=initials(msg.sender);row.appendChild(av);}
    group.appendChild(row);container.appendChild(group);
  });
  if(wasAtBottom) container.scrollTop=container.scrollHeight;
}

function createRoom(){
  const name=document.getElementById('new-room-input').value.trim();
  if(!name) return;
  const id='room_'+Date.now();
  set(ref(db,'rooms/'+id),{name});
  document.getElementById('modal').classList.remove('open');
  setTimeout(()=>openRoom(id,name),300);
}
</script>
</body>
</html>
