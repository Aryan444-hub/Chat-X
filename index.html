<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat-X Messenger</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f0f13; color: #e8e8f0; height: 100dvh; display: flex; align-items: center; justify-content: center; }

    /* PASSWORD SCREEN */
    .password-screen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 100vw; height: 100dvh; gap: 0;
    }
    .password-card {
      background: #16161e; border: 1px solid #2a2a3a; border-radius: 18px;
      padding: 36px 32px; width: 320px; display: flex; flex-direction: column; align-items: center; gap: 16px;
    }
    .password-card .logo { font-size: 28px; font-weight: 800; color: #e8e8f0; letter-spacing: -1px; }
    .password-card .logo span { color: #7F77DD; }
    .password-card .subtitle { font-size: 13px; color: #555; text-align: center; }
    .password-card input {
      width: 100%; font-size: 15px; padding: 10px 14px; border: 1px solid #2a2a3a;
      border-radius: 10px; background: #1e1e2a; color: #e8e8f0; outline: none;
      font-family: inherit; text-align: center; letter-spacing: 4px; transition: border-color 0.15s;
    }
    .password-card input:focus { border-color: #534AB7; }
    .password-card input::placeholder { letter-spacing: 0; color: #444; }
    .password-card button {
      width: 100%; padding: 11px; background: #534AB7; color: white; border: none;
      border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer;
      font-family: inherit; transition: background 0.15s;
    }
    .password-card button:hover { background: #3C3489; }
    .password-card .error { font-size: 12px; color: #F0997B; display: none; }
    .password-card .error.show { display: block; }
    .name-step { display: none; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
    .name-step.show { display: flex; }
    .name-step label { font-size: 13px; color: #888; }
    .name-step input {
      width: 100%; font-size: 15px; padding: 10px 14px; border: 1px solid #2a2a3a;
      border-radius: 10px; background: #1e1e2a; color: #e8e8f0; outline: none;
      font-family: inherit; text-align: center; transition: border-color 0.15s;
    }
    .name-step input:focus { border-color: #534AB7; }

    /* APP */
    .app { display: none; width: 100vw; height: 100dvh; max-width: 980px; max-height: 720px; border-radius: 16px; overflow: hidden; border: 1px solid #2a2a3a; background: #16161e; box-shadow: 0 24px 80px rgba(0,0,0,0.6); }
    .app.show { display: flex; }
    .sidebar { width: 230px; min-width: 230px; border-right: 1px solid #2a2a3a; display: flex; flex-direction: column; background: #11111a; }
    .sidebar-header { padding: 14px 16px; border-bottom: 1px solid #2a2a3a; display: flex; align-items: center; gap: 8px; }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #1D9E75; animation: pulse 2s infinite; flex-shrink: 0; }
    @keyframes pulse { 0%,100%{box-shadow:0 0 0 2px #9FE1CB44} 50%{box-shadow:0 0 0 5px #9FE1CB22} }
    .app-title { font-size: 15px; font-weight: 800; color: #e8e8f0; letter-spacing: -0.5px; }
    .app-title span { color: #7F77DD; }
    .conn-badge { margin-left: auto; font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600; }
    .conn-badge.online { background: #0F6E5622; color: #5DCAA5; border: 1px solid #0F6E5644; }
    .conn-badge.offline { background: #99220022; color: #F0997B; border: 1px solid #99220044; }
    .user-bar { padding: 10px 12px; border-bottom: 1px solid #2a2a3a; display: flex; align-items: center; gap: 8px; }
    .user-avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
    .user-info { flex: 1; min-width: 0; }
    .user-name { font-size: 13px; font-weight: 600; color: #e8e8f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .admin-badge { font-size: 9px; background: #534AB733; color: #7F77DD; border: 1px solid #534AB755; border-radius: 6px; padding: 1px 5px; font-weight: 700; }
    .rooms-section { flex: 1; overflow-y: auto; padding: 6px 0; }
    .section-label { font-size: 10px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: #444; padding: 8px 14px 4px; }
    .room-item { padding: 8px 14px; cursor: pointer; display: flex; align-items: center; gap: 9px; transition: background 0.1s; position: relative; }
    .room-item:hover { background: #1e1e2a; }
    .room-item.active { background: #1e1e2a; border-left: 2px solid #534AB7; }
    .room-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
    .room-info { flex: 1; min-width: 0; }
    .room-name { font-size: 13px; font-weight: 600; color: #e8e8f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .room-preview { font-size: 11px; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
    .room-delete-btn { display: none; background: none; border: none; color: #993C1D; cursor: pointer; padding: 2px 4px; border-radius: 4px; font-size: 14px; }
    .room-item:hover .room-delete-btn.visible { display: flex; }
    .add-room-btn { margin: 8px 12px; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: #555; cursor: pointer; padding: 6px 10px; border-radius: 8px; border: 1px dashed #2a2a3a; background: none; transition: all 0.15s; width: calc(100% - 24px); font-family: inherit; }
    .add-room-btn:hover { background: #1e1e2a; color: #aaa; border-color: #444; }
    .share-tip { font-size: 10px; color: #444; padding: 8px 14px; border-top: 1px solid #2a2a3a; text-align: center; line-height: 1.5; }
    .chat-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .chat-header { padding: 12px 18px; border-bottom: 1px solid #2a2a3a; display: flex; align-items: center; gap: 10px; background: #13131c; }
    .chat-header .room-avatar-lg { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; flex-shrink: 0; }
    .chat-header .room-title { font-size: 15px; font-weight: 700; color: #e8e8f0; }
    .chat-header .room-meta { font-size: 11px; color: #555; }
    .live-badge { margin-left: auto; font-size: 11px; color: #5DCAA5; background: #0F6E5622; border: 1px solid #0F6E5644; border-radius: 20px; padding: 3px 10px; font-weight: 600; }
    .messages { flex: 1; overflow-y: auto; padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; }
    .messages::-webkit-scrollbar { width: 4px; } .messages::-webkit-scrollbar-thumb { background: #2a2a3a; border-radius: 4px; }
    .date-div { text-align: center; font-size: 11px; color: #444; display: flex; align-items: center; gap: 8px; margin: 4px 0; }
    .date-div::before,.date-div::after { content:''; flex:1; border-top: 1px solid #2a2a3a; }
    .msg-group { display: flex; flex-direction: column; gap: 2px; }
    .msg-sender { font-size: 10px; font-weight: 700; color: #555; margin-bottom: 2px; padding-left: 33px; }
    .msg-sender.own { text-align: right; padding-left: 0; padding-right: 33px; }
    .msg-row { display: flex; align-items: flex-end; gap: 7px; position: relative; }
    .msg-row.own { flex-direction: row-reverse; }
    .msg-avatar { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; }
    .msg-bubble { max-width: 66%; padding: 8px 12px; border-radius: 16px; font-size: 13px; line-height: 1.5; background: #1e1e2a; color: #e8e8f0; border: 1px solid #2a2a3a; word-break: break-word; }
    .msg-bubble.own { background: #534AB7; color: white; border-color: transparent; border-bottom-right-radius: 4px; }
    .msg-bubble:not(.own) { border-bottom-left-radius: 4px; }
    .msg-time { font-size: 10px; color: #444; padding: 0 3px; align-self: flex-end; white-space: nowrap; }
    .msg-delete-btn { display: none; background: none; border: none; color: #993C1D; cursor: pointer; padding: 3px 5px; border-radius: 5px; font-size: 13px; align-self: center; }
    .msg-row:hover .msg-delete-btn.visible { display: flex; }
    .typing-row { min-height: 26px; display: flex; align-items: center; padding: 0 18px 4px; }
    .typing-text { font-size: 11px; color: #555; font-style: italic; }
    .input-area { padding: 10px 14px; border-top: 1px solid #2a2a3a; display: flex; align-items: flex-end; gap: 8px; background: #13131c; }
    .input-area textarea { flex: 1; font-size: 13px; border: 1px solid #2a2a3a; border-radius: 20px; padding: 9px 14px; resize: none; outline: none; background: #1e1e2a; color: #e8e8f0; min-height: 38px; max-height: 100px; line-height: 1.5; overflow-y: auto; transition: border-color 0.15s; font-family: inherit; }
    .input-area textarea:focus { border-color: #534AB7; }
    .input-area textarea::placeholder { color: #444; }
    .send-btn { width: 38px; height: 38px; border-radius: 50%; background: #534AB7; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: white; transition: background 0.15s, transform 0.1s; font-size: 16px; }
    .send-btn:hover { background: #3C3489; }
    .send-btn:active { transform: scale(0.95); }
    .send-btn:disabled { background: #1e1e2a; color: #444; cursor: default; }
    .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #444; font-size: 14px; }
    .modal-overlay { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.65); align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal-box { background: #16161e; border-radius: 14px; border: 1px solid #2a2a3a; padding: 22px; width: 280px; }
    .modal-box h3 { font-size: 15px; font-weight: 700; margin-bottom: 14px; color: #e8e8f0; }
    .modal-box input { width: 100%; font-size: 13px; padding: 8px 12px; border: 1px solid #2a2a3a; border-radius: 8px; background: #1e1e2a; color: #e8e8f0; outline: none; margin-bottom: 12px; font-family: inherit; }
    .modal-box input:focus { border-color: #534AB7; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .modal-actions button { font-size: 12px; font-weight: 600; padding: 7px 16px; border-radius: 8px; cursor: pointer; border: 1px solid #2a2a3a; background: transparent; color: #888; font-family: inherit; transition: background 0.1s; }
    .modal-actions button:hover { background: #1e1e2a; }
    .modal-actions button.primary { background: #534AB7; color: white; border-color: transparent; }
    .modal-actions button.primary:hover { background: #3C3489; }
    .modal-actions button.danger { background: #993C1D; color: white; border-color: transparent; }
    .admin-panel { background: #13131c; border-top: 1px solid #2a2a3a; padding: 8px 14px; display: none; gap: 8px; flex-wrap: wrap; }
    .admin-panel.show { display: flex; }
    .admin-panel-title { font-size: 10px; font-weight: 700; color: #7F77DD; letter-spacing: 0.5px; text-transform: uppercase; width: 100%; margin-bottom: 2px; }
    .admin-btn { font-size: 11px; font-weight: 600; padding: 5px 10px; border-radius: 7px; cursor: pointer; border: 1px solid #2a2a3a; background: #1e1e2a; color: #aaa; font-family: inherit; display: flex; align-items: center; gap: 5px; transition: all 0.1s; }
    .admin-btn:hover { background: #2a2a3a; color: #e8e8f0; }
    .admin-btn.danger { border-color: #99220044; color: #F0997B; }
    .admin-btn.danger:hover { background: #99220033; }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1e1e2a; border: 1px solid #2a2a3a; color: #e8e8f0; font-size: 13px; padding: 10px 20px; border-radius: 10px; z-index: 999; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    .toast.show { opacity: 1; }
    .back-btn { display: none; background: none; border: none; color: #aaa; cursor: pointer; font-size: 20px; padding: 2px 6px; margin-right: 2px; }
    @media (max-width: 600px) {
      body { align-items: stretch; justify-content: stretch; }
      .password-card { width: 92vw; padding: 28px 20px; border-radius: 16px; }
      .app { max-width: 100vw; max-height: 100dvh; border-radius: 0; border: none; }
      .sidebar { width: 100%; min-width: unset; border-right: none; height: 100dvh; position: absolute; top: 0; left: 0; z-index: 10; transition: transform 0.25s ease; background: #11111a; }
      .sidebar.hidden { transform: translateX(-100%); pointer-events: none; }
      .chat-area { width: 100%; height: 100dvh; }
      .back-btn { display: flex !important; align-items: center; }
      .msg-bubble { max-width: 82%; font-size: 14px; }
      .msg-delete-btn.visible { display: flex !important; }
      .room-delete-btn.visible { display: flex !important; }
      .input-area textarea { font-size: 16px; }
      .modal-box { width: 90vw; }
    }
  </style>
</head>
<body>

<!-- PASSWORD SCREEN -->
<div class="password-screen" id="password-screen">
  <div class="password-card">
    <div class="logo">Chat<span>-X</span></div>
    <div class="subtitle">Enter the password to join</div>
    <div id="pass-step">
      <input type="password" id="pass-input" placeholder="Enter password…" maxlength="30" style="margin-bottom:10px" />
      <div class="error" id="pass-error">Wrong password. Try again.</div>
      <button id="pass-btn" style="margin-top:8px">Enter Chat</button>
    </div>
    <div class="name-step" id="name-step">
      <label>You're in! What's your name?</label>
      <input type="text" id="name-input" placeholder="Your name…" maxlength="20" />
      <div class="error" id="name-error">Please enter your name.</div>
      <button id="name-btn">Start Chatting →</button>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div class="app" id="app">
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="live-dot"></div>
      <span class="app-title">Chat<span>-X</span></span>
      <span class="conn-badge offline" id="conn-status">…</span>
    </div>
    <div class="user-bar" id="user-bar"></div>
    <div class="rooms-section" id="rooms-list"><div class="section-label">Rooms</div></div>
    <button class="add-room-btn" id="add-room-btn"><i class="ti ti-plus"></i> New room</button>
    <div class="share-tip">Share the site link + password <strong>404</strong> with friends!</div>
  </div>
  <div class="chat-area" id="chat-area">
    <div class="empty-state"><i class="ti ti-message-dots" style="font-size:36px;opacity:0.2"></i><span>Select a room to start chatting</span></div>
  </div>
</div>

<!-- NEW ROOM MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <h3>Create a new room</h3>
    <input id="new-room-input" placeholder="Room name…" maxlength="30" />
    <div class="modal-actions">
      <button id="modal-cancel">Cancel</button>
      <button class="primary" id="modal-create">Create</button>
    </div>
  </div>
</div>

<!-- CONFIRM DELETE MODAL -->
<div class="modal-overlay" id="confirm-modal">
  <div class="modal-box">
    <h3 id="confirm-title">Are you sure?</h3>
    <p style="font-size:13px;color:#888;margin-bottom:16px" id="confirm-desc"></p>
    <div class="modal-actions">
      <button id="confirm-cancel">Cancel</button>
      <button class="danger" id="confirm-ok">Delete</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, onValue, set, remove, off } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const ENTRY_PASSWORD = '404';
const ADMIN_PASSWORD = '1511';

// Restore session if already logged in
const savedName = localStorage.getItem('chatx_name');
const savedAdmin = localStorage.getItem('chatx_admin') === 'true';
if (savedName) {
  document.getElementById('password-screen').style.display = 'none';
  document.getElementById('app').classList.add('show');
}

const firebaseConfig = {
  apiKey: "AIzaSyDliubo95VE1QDs2BLHSQYNOJXB1F18LB4",
  authDomain: "my-messenger-b2f6b.firebaseapp.com",
  databaseURL: "https://my-messenger-b2f6b-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "my-messenger-b2f6b",
  storageBucket: "my-messenger-b2f6b.firebasestorage.app",
  messagingSenderId: "607585559489",
  appId: "1:607585559489:web:7315aeb66f79cd96f34540"
};

const firebaseApp = initializeApp(firebaseConfig);
const db = getDatabase(firebaseApp);

const COLORS = ['#7F77DD|#7F77DD','#1D9E75|#1D9E75','#D85A30|#D85A30','#378ADD|#378ADD','#EF9F27|#EF9F27','#D4537E|#D4537E'];
function getColor(name) {
  let h = 0; for (let c of (name||'?')) h = ((h<<5)-h)+c.charCodeAt(0);
  return COLORS[Math.abs(h)%COLORS.length].split('|')[0];
}
function initials(name) { return (name||'?').trim().split(/\s+/).map(w=>w[0]).join('').toUpperCase().slice(0,2)||'?'; }
function formatTime(ts) { return new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }
function dateStr(ts) { return new Date(ts).toLocaleDateString([],{weekday:'long',month:'short',day:'numeric'}); }

let myName = localStorage.getItem('chatx_name') || '';
let isAdmin = localStorage.getItem('chatx_admin') === 'true';
let activeRoomId = null;
let roomsData = {};
let msgListenerRoom = null;

// Toast
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// Confirm modal
function confirmAction(title, desc, onOk) {
  const m = document.getElementById('confirm-modal');
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-desc').textContent = desc;
  m.classList.add('open');
  const ok = document.getElementById('confirm-ok');
  const cancel = document.getElementById('confirm-cancel');
  const close = () => m.classList.remove('open');
  ok.onclick = () => { close(); onOk(); };
  cancel.onclick = close;
}

// PASSWORD SCREEN
const passInput = document.getElementById('pass-input');

if (savedName) {
  myName = savedName;
  isAdmin = savedAdmin;
  initApp();
}
const passBtn = document.getElementById('pass-btn');
const passError = document.getElementById('pass-error');
const nameStep = document.getElementById('name-step');
const nameInput = document.getElementById('name-input');
const nameBtn = document.getElementById('name-btn');
const nameError = document.getElementById('name-error');

passBtn.addEventListener('click', checkPassword);
passInput.addEventListener('keydown', e => { if(e.key==='Enter') checkPassword(); });

function checkPassword() {
  const val = passInput.value.trim();
  if (val === ENTRY_PASSWORD || val === ADMIN_PASSWORD) {
    if (val === ADMIN_PASSWORD) isAdmin = true;
    document.getElementById('pass-step').style.display = 'none';
    nameStep.classList.add('show');
    passError.classList.remove('show');
    setTimeout(() => nameInput.focus(), 50);
  } else {
    passError.classList.add('show');
    passInput.value = '';
  }
}

nameBtn.addEventListener('click', enterChat);
nameInput.addEventListener('keydown', e => { if(e.key==='Enter') enterChat(); });

function enterChat() {
  const name = nameInput.value.trim();
  if (!name) { nameError.classList.add('show'); return; }
  myName = name;
  localStorage.setItem('chatx_name', myName);
  localStorage.setItem('chatx_admin', isAdmin ? 'true' : 'false');
  document.getElementById('password-screen').style.display = 'none';
  document.getElementById('app').classList.add('show');
  initApp();
}

function initApp() {
  // User bar
  const color = getColor(myName);
  document.getElementById('user-bar').innerHTML = `
    <div class="user-avatar" style="background:${color}22;color:${color}">${initials(myName)}</div>
    <div class="user-info">
      <div class="user-name">${myName}</div>
    </div>
    ${isAdmin ? '<span class="admin-badge">ADMIN</span>' : ''}
    <button title="Switch account" onclick="logout()" style="margin-left:auto;background:none;border:none;color:#555;cursor:pointer;font-size:16px;padding:2px 4px;border-radius:5px;" onmouseover="this.style.color='#e8e8f0'" onmouseout="this.style.color='#555'"><i class="ti ti-logout"></i></button>
  `;

  // Connection
  onValue(ref(db, '.info/connected'), snap => {
    const el = document.getElementById('conn-status');
    el.textContent = snap.val() ? 'live' : 'offline';
    el.className = 'conn-badge ' + (snap.val() ? 'online' : 'offline');
  });

  // Rooms
  onValue(ref(db, 'rooms'), snap => {
    const data = snap.val() || {};
    if (Object.keys(data).length === 0) {
      set(ref(db, 'rooms/general'), { name: 'General' });
      set(ref(db, 'rooms/random'), { name: 'Random' });
      set(ref(db, 'rooms/gaming'), { name: 'Gaming' });
    } else {
      roomsData = data;
      renderRooms();
    }
  });

  document.getElementById('add-room-btn').addEventListener('click', () => {
    document.getElementById('new-room-input').value = '';
    document.getElementById('modal').classList.add('open');
    setTimeout(() => document.getElementById('new-room-input').focus(), 50);
  });
  document.getElementById('modal-cancel').addEventListener('click', () => document.getElementById('modal').classList.remove('open'));
  document.getElementById('modal-create').addEventListener('click', createRoom);
  document.getElementById('new-room-input').addEventListener('keydown', e => { if(e.key==='Enter') createRoom(); if(e.key==='Escape') document.getElementById('modal').classList.remove('open'); });
}

function renderRooms() {
  const roomsList = document.getElementById('rooms-list');
  roomsList.innerHTML = '<div class="section-label">Rooms</div>';
  Object.entries(roomsData).forEach(([id, room]) => {
    const color = getColor(room.name);
    const div = document.createElement('div');
    div.className = 'room-item' + (id === activeRoomId ? ' active' : '');
    div.innerHTML = `
      <div class="room-avatar" style="background:${color}22;color:${color}">${initials(room.name)}</div>
      <div class="room-info">
        <div class="room-name">${room.name}</div>
        <div class="room-preview">${room.lastMsg||'No messages yet'}</div>
      </div>
      ${isAdmin ? `<button class="room-delete-btn visible" title="Delete room" data-id="${id}" data-name="${room.name}"><i class="ti ti-trash"></i></button>` : ''}
    `;
    div.addEventListener('click', (e) => {
      if (e.target.closest('.room-delete-btn')) return;
      openRoom(id, room.name);
    });
    if (isAdmin) {
      div.querySelector('.room-delete-btn').addEventListener('click', e => {
        e.stopPropagation();
        confirmAction('Delete room?', `This will permanently delete "${room.name}" and all its messages.`, () => {
          remove(ref(db, 'rooms/' + id));
          remove(ref(db, 'messages/' + id));
          remove(ref(db, 'typing/' + id));
          if (activeRoomId === id) {
            activeRoomId = null;
            document.getElementById('chat-area').innerHTML = '<div class="empty-state"><i class="ti ti-message-dots" style="font-size:36px;opacity:0.2"></i><span>Select a room to start chatting</span></div>';
          }
          showToast('Room deleted.');
        });
      });
    }
    roomsList.appendChild(div);
  });
}

function openRoom(id, name) {
  activeRoomId = id; renderRooms();
  // On mobile, hide sidebar when a room is opened
  if (window.innerWidth <= 600) {
    const sidebar = document.querySelector('.sidebar');
    if (sidebar) sidebar.classList.add('hidden');
  }
  if (msgListenerRoom) { off(ref(db, 'messages/' + msgListenerRoom)); off(ref(db, 'typing/' + msgListenerRoom)); }
  msgListenerRoom = id;
  const color = getColor(name);
  const chatArea = document.getElementById('chat-area');
  chatArea.innerHTML = `
    <div class="chat-header">
      <button class="back-btn" id="back-btn" aria-label="Back to rooms"><i class="ti ti-arrow-left"></i></button>
      <div class="room-avatar-lg" style="background:${color}22;color:${color}">${initials(name)}</div>
      <div><div class="room-title">${name}</div><div class="room-meta">Live room</div></div>
      <span class="live-badge">● live</span>
    </div>
    <div class="messages" id="messages"></div>
    <div class="typing-row" id="typing-row"></div>
    ${isAdmin ? `<div class="admin-panel show" id="admin-panel">
      <div class="admin-panel-title"><i class="ti ti-shield"></i> Admin controls</div>
      <button class="admin-btn danger" id="clear-msgs-btn"><i class="ti ti-trash"></i> Clear all messages</button>
      <button class="admin-btn danger" id="delete-room-btn"><i class="ti ti-x"></i> Delete this room</button>
    </div>` : ''}
    <div class="input-area">
      <textarea id="msg-input" placeholder="Write a message… (Enter to send)" rows="1"></textarea>
      <button class="send-btn" id="send-btn" disabled><i class="ti ti-send"></i></button>
    </div>
  `;

  if (isAdmin) {
    document.getElementById('clear-msgs-btn').addEventListener('click', () => {
      confirmAction('Clear all messages?', `This will delete all messages in "${name}".`, () => {
        remove(ref(db, 'messages/' + id));
        showToast('All messages cleared.');
      });
    });
    document.getElementById('delete-room-btn').addEventListener('click', () => {
      confirmAction('Delete this room?', `"${name}" and all its messages will be gone forever.`, () => {
        remove(ref(db, 'rooms/' + id));
        remove(ref(db, 'messages/' + id));
        remove(ref(db, 'typing/' + id));
        activeRoomId = null;
        chatArea.innerHTML = '<div class="empty-state"><i class="ti ti-message-dots" style="font-size:36px;opacity:0.2"></i><span>Select a room to start chatting</span></div>';
        showToast('Room deleted.');
      });
    });
  }

  const textarea = document.getElementById('msg-input');
  const sendBtn = document.getElementById('send-btn');
  textarea.addEventListener('input', () => {
    textarea.style.height = 'auto';
    textarea.style.height = Math.min(textarea.scrollHeight, 100) + 'px';
    sendBtn.disabled = !textarea.value.trim();
    updateTyping(textarea.value.trim().length > 0);
  });
  textarea.addEventListener('keydown', e => { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doSend();} });
  sendBtn.addEventListener('click', doSend);

  // Mobile: back button shows sidebar
  const backBtn = document.getElementById('back-btn');
  if (backBtn) {
    backBtn.addEventListener('click', () => {
      const sidebar = document.querySelector('.sidebar');
      if (sidebar) sidebar.classList.remove('hidden');
    });
  }

  onValue(ref(db, 'messages/' + id), snap => {
    const msgs = Object.entries(snap.val()||{}).map(([k,v])=>({...v,_key:k})).sort((a,b)=>a.ts-b.ts);
    renderMessages(msgs, id);
    if (msgs.length>0) set(ref(db,'rooms/'+id+'/lastMsg'), msgs[msgs.length-1].sender+': '+msgs[msgs.length-1].text.slice(0,30));
  });

  onValue(ref(db, 'typing/' + id), snap => {
    const key = myName.replace(/[.#$\[\]]/g,'_');
    const others = Object.entries(snap.val()||{}).filter(([k,v])=>k!==key&&v).map(([k])=>k);
    const row = document.getElementById('typing-row');
    if (row) row.innerHTML = others.length ? `<span class="typing-text">${others.join(', ')} ${others.length===1?'is':'are'} typing…</span>` : '';
  });
}

let typingTimeout = null;
function updateTyping(isTyping) {
  if (!myName||!activeRoomId) return;
  const key = myName.replace(/[.#$\[\]]/g,'_');
  const tRef = ref(db,'typing/'+activeRoomId+'/'+key);
  if (isTyping) { set(tRef,true); clearTimeout(typingTimeout); typingTimeout=setTimeout(()=>set(tRef,false),3000); }
  else set(tRef,false);
}

function doSend() {
  const textarea = document.getElementById('msg-input');
  const text = textarea?.value.trim();
  if (!text||!myName) return;
  push(ref(db,'messages/'+activeRoomId),{sender:myName,text,ts:Date.now()});
  textarea.value=''; textarea.style.height='auto';
  document.getElementById('send-btn').disabled=true;
  updateTyping(false);
}

function renderMessages(msgs, roomId) {
  const container = document.getElementById('messages');
  if (!container) return;
  container.innerHTML = '';
  if (!msgs.length) { container.innerHTML='<div style="text-align:center;font-size:12px;color:#444;margin:auto">No messages yet. Say hello!</div>'; return; }
  let lastDate=null;
  msgs.forEach(msg => {
    const ds=dateStr(msg.ts);
    if (ds!==lastDate) { const d=document.createElement('div'); d.className='date-div'; d.textContent=ds; container.appendChild(d); lastDate=ds; }
    const isOwn=msg.sender===myName;
    const color=getColor(msg.sender);
    const group=document.createElement('div'); group.className='msg-group';
    const senderDiv=document.createElement('div'); senderDiv.className='msg-sender'+(isOwn?' own':''); senderDiv.textContent=msg.sender; group.appendChild(senderDiv);
    const row=document.createElement('div'); row.className='msg-row'+(isOwn?' own':'');
    if (!isOwn) { const av=document.createElement('div'); av.className='msg-avatar'; av.style.cssText=`background:${color}22;color:${color}`; av.textContent=initials(msg.sender); row.appendChild(av); }
    const bubble=document.createElement('div'); bubble.className='msg-bubble'+(isOwn?' own':''); bubble.textContent=msg.text; row.appendChild(bubble);
    const time=document.createElement('div'); time.className='msg-time'; time.textContent=formatTime(msg.ts); row.appendChild(time);
    if (isAdmin && msg._key) {
      const delBtn=document.createElement('button'); delBtn.className='msg-delete-btn visible'; delBtn.title='Delete message'; delBtn.innerHTML='<i class="ti ti-trash"></i>';
      delBtn.addEventListener('click', () => { remove(ref(db,'messages/'+roomId+'/'+msg._key)); showToast('Message deleted.'); });
      row.appendChild(delBtn);
    }
    if (isOwn) { const av=document.createElement('div'); av.className='msg-avatar'; av.style.cssText=`background:#534AB733;color:#7F77DD`; av.textContent=initials(msg.sender); row.appendChild(av); }
    group.appendChild(row); container.appendChild(group);
  });
  container.scrollTop=container.scrollHeight;
}

window.logout = function() {
  localStorage.removeItem('chatx_name');
  localStorage.removeItem('chatx_admin');
  location.reload();
}

function createRoom() {
  const name=document.getElementById('new-room-input').value.trim();
  if (!name) return;
  const id='room_'+Date.now();
  set(ref(db,'rooms/'+id),{name});
  document.getElementById('modal').classList.remove('open');
  setTimeout(()=>openRoom(id,name),300);
}
</script>
</body>
</html>
