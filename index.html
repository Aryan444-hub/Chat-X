<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat-X Messenger</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f0f13; color: #e8e8f0; height: 100dvh; display: flex; align-items: center; justify-content: center; }
    .app { display: flex; width: 100vw; height: 100dvh; max-width: 960px; max-height: 700px; border-radius: 16px; overflow: hidden; border: 1px solid #2a2a3a; background: #16161e; box-shadow: 0 24px 80px rgba(0,0,0,0.6); }
    .sidebar { width: 230px; min-width: 230px; border-right: 1px solid #2a2a3a; display: flex; flex-direction: column; background: #11111a; }
    .sidebar-header { padding: 16px; border-bottom: 1px solid #2a2a3a; display: flex; align-items: center; gap: 8px; }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #1D9E75; animation: pulse 2s infinite; flex-shrink: 0; }
    @keyframes pulse { 0%,100%{box-shadow:0 0 0 2px #9FE1CB44} 50%{box-shadow:0 0 0 5px #9FE1CB22} }
    .app-title { font-size: 16px; font-weight: 700; color: #e8e8f0; letter-spacing: -0.3px; }
    .conn-badge { margin-left: auto; font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
    .conn-badge.online { background: #0F6E5622; color: #5DCAA5; border: 1px solid #0F6E5644; }
    .conn-badge.offline { background: #99220022; color: #F0997B; border: 1px solid #99220044; }
    .name-bar { padding: 10px 12px; border-bottom: 1px solid #2a2a3a; }
    .name-bar label { font-size: 10px; color: #666; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; display: block; margin-bottom: 4px; }
    .name-bar input { width: 100%; font-size: 13px; font-weight: 500; border: 1px solid #2a2a3a; border-radius: 8px; padding: 6px 10px; color: #e8e8f0; background: #1e1e2a; outline: none; font-family: inherit; transition: border-color 0.15s; }
    .name-bar input:focus { border-color: #534AB7; }
    .rooms-section { flex: 1; overflow-y: auto; padding: 8px 0; }
    .section-label { font-size: 10px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: #444; padding: 8px 14px 4px; }
    .room-item { padding: 8px 14px; cursor: pointer; display: flex; align-items: center; gap: 9px; transition: background 0.1s; border-radius: 0; }
    .room-item:hover { background: #1e1e2a; }
    .room-item.active { background: #1e1e2a; border-left: 2px solid #534AB7; }
    .room-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
    .room-info { flex: 1; min-width: 0; }
    .room-name { font-size: 13px; font-weight: 600; color: #e8e8f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .room-preview { font-size: 11px; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
    .add-room-btn { margin: 8px 12px; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: #555; cursor: pointer; padding: 6px 10px; border-radius: 8px; border: 1px dashed #2a2a3a; background: none; transition: all 0.15s; width: calc(100% - 24px); font-family: inherit; }
    .add-room-btn:hover { background: #1e1e2a; color: #aaa; border-color: #444; }
    .share-tip { font-size: 10px; color: #444; padding: 8px 14px; border-top: 1px solid #2a2a3a; text-align: center; line-height: 1.5; }
    .chat-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .chat-header { padding: 14px 18px; border-bottom: 1px solid #2a2a3a; display: flex; align-items: center; gap: 10px; background: #13131c; }
    .chat-header .room-avatar-lg { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; flex-shrink: 0; }
    .chat-header .room-title { font-size: 15px; font-weight: 700; color: #e8e8f0; }
    .chat-header .room-meta { font-size: 11px; color: #555; }
    .live-badge { margin-left: auto; font-size: 11px; color: #5DCAA5; background: #0F6E5622; border: 1px solid #0F6E5644; border-radius: 20px; padding: 3px 10px; font-weight: 600; }
    .messages { flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
    .messages::-webkit-scrollbar { width: 4px; } .messages::-webkit-scrollbar-track { background: transparent; } .messages::-webkit-scrollbar-thumb { background: #2a2a3a; border-radius: 4px; }
    .date-div { text-align: center; font-size: 11px; color: #444; display: flex; align-items: center; gap: 8px; margin: 4px 0; }
    .date-div::before,.date-div::after { content:''; flex:1; border-top: 1px solid #2a2a3a; }
    .msg-group { display: flex; flex-direction: column; gap: 2px; }
    .msg-sender { font-size: 10px; font-weight: 700; color: #555; margin-bottom: 2px; padding-left: 33px; }
    .msg-sender.own { text-align: right; padding-left: 0; padding-right: 33px; }
    .msg-row { display: flex; align-items: flex-end; gap: 7px; }
    .msg-row.own { flex-direction: row-reverse; }
    .msg-avatar { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; }
    .msg-bubble { max-width: 68%; padding: 8px 12px; border-radius: 16px; font-size: 13px; line-height: 1.5; background: #1e1e2a; color: #e8e8f0; border: 1px solid #2a2a3a; word-break: break-word; }
    .msg-bubble.own { background: #534AB7; color: white; border-color: transparent; border-bottom-right-radius: 4px; }
    .msg-bubble:not(.own) { border-bottom-left-radius: 4px; }
    .msg-time { font-size: 10px; color: #444; padding: 0 3px; align-self: flex-end; white-space: nowrap; }
    .typing-row { min-height: 28px; display: flex; align-items: center; padding: 0 18px 6px; }
    .typing-text { font-size: 11px; color: #555; font-style: italic; }
    .input-area { padding: 12px 16px; border-top: 1px solid #2a2a3a; display: flex; align-items: flex-end; gap: 8px; background: #13131c; }
    .input-area textarea { flex: 1; font-size: 13px; border: 1px solid #2a2a3a; border-radius: 20px; padding: 9px 14px; resize: none; outline: none; background: #1e1e2a; color: #e8e8f0; min-height: 38px; max-height: 100px; line-height: 1.5; overflow-y: auto; transition: border-color 0.15s; font-family: inherit; }
    .input-area textarea:focus { border-color: #534AB7; }
    .input-area textarea::placeholder { color: #444; }
    .send-btn { width: 38px; height: 38px; border-radius: 50%; background: #534AB7; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: white; transition: background 0.15s, transform 0.1s; font-size: 16px; }
    .send-btn:hover { background: #3C3489; }
    .send-btn:active { transform: scale(0.95); }
    .send-btn:disabled { background: #1e1e2a; color: #444; cursor: default; }
    .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #444; font-size: 14px; }
    .empty-state i { font-size: 36px; opacity: 0.3; }
    .modal-overlay { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal-box { background: #16161e; border-radius: 14px; border: 1px solid #2a2a3a; padding: 22px; width: 280px; }
    .modal-box h3 { font-size: 15px; font-weight: 700; margin-bottom: 14px; color: #e8e8f0; }
    .modal-box input { width: 100%; font-size: 13px; padding: 8px 12px; border: 1px solid #2a2a3a; border-radius: 8px; background: #1e1e2a; color: #e8e8f0; outline: none; margin-bottom: 12px; font-family: inherit; }
    .modal-box input:focus { border-color: #534AB7; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .modal-actions button { font-size: 12px; font-weight: 600; padding: 7px 16px; border-radius: 8px; cursor: pointer; border: 1px solid #2a2a3a; background: transparent; color: #888; font-family: inherit; transition: background 0.1s; }
    .modal-actions button:hover { background: #1e1e2a; }
    .modal-actions button.primary { background: #534AB7; color: white; border-color: transparent; }
    .modal-actions button.primary:hover { background: #3C3489; }
  </style>
</head>
<body>
<div class="app" id="app">
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="live-dot"></div>
      <span class="app-title">Chat-X</span>
      <span class="conn-badge offline" id="conn-status">connecting…</span>
    </div>
    <div class="name-bar">
      <label>Your name</label>
      <input id="my-name" placeholder="Enter your name…" maxlength="20" />
    </div>
    <div class="rooms-section" id="rooms-list">
      <div class="section-label">Rooms</div>
    </div>
    <button class="add-room-btn" id="add-room-btn"><i class="ti ti-plus"></i> New room</button>
    <div class="share-tip">Share this link with friends to chat live!</div>
  </div>
  <div class="chat-area" id="chat-area">
    <div class="empty-state">
      <i class="ti ti-message-dots"></i>
      <span>Select a room to start chatting</span>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <h3>Create a new room</h3>
    <input id="new-room-input" placeholder="Room name…" maxlength="30" />
    <div class="modal-actions">
      <button id="modal-cancel">Cancel</button>
      <button class="primary" id="modal-create">Create</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, onValue, set, off } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDliubo95VE1QDs2BLHSQYNOJXB1F18LB4",
  authDomain: "my-messenger-b2f6b.firebaseapp.com",
  databaseURL: "https://my-messenger-b2f6b-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "my-messenger-b2f6b",
  storageBucket: "my-messenger-b2f6b.firebasestorage.app",
  messagingSenderId: "607585559489",
  appId: "1:607585559489:web:7315aeb66f79cd96f34540"
};

const firebaseApp = initializeApp(firebaseConfig);
const db = getDatabase(firebaseApp);

const COLORS = ['#7F77DD|#EEEDFE','#1D9E75|#E1F5EE','#D85A30|#FAECE7','#378ADD|#E6F1FB','#EF9F27|#FAEEDA','#D4537E|#FBEAF0'];
function getColor(name) {
  let h = 0; for (let c of (name||'?')) h = ((h<<5)-h)+c.charCodeAt(0);
  const [fg,bg] = COLORS[Math.abs(h)%COLORS.length].split('|');
  return {bg, fg};
}
function initials(name) { return (name||'?').trim().split(/\s+/).map(w=>w[0]).join('').toUpperCase().slice(0,2)||'?'; }
function formatTime(ts) { return new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }
function dateStr(ts) { return new Date(ts).toLocaleDateString([],{weekday:'long',month:'short',day:'numeric'}); }

let myName = '';
let activeRoomId = null;
let roomsData = {};
let msgListenerRoom = null;

const myNameInput = document.getElementById('my-name');
const roomsList = document.getElementById('rooms-list');
const chatArea = document.getElementById('chat-area');
const addRoomBtn = document.getElementById('add-room-btn');
const modal = document.getElementById('modal');
const newRoomInput = document.getElementById('new-room-input');
const connStatus = document.getElementById('conn-status');

onValue(ref(db, '.info/connected'), snap => {
  connStatus.textContent = snap.val() ? 'live' : 'offline';
  connStatus.className = 'conn-badge ' + (snap.val() ? 'online' : 'offline');
});

onValue(ref(db, 'rooms'), snap => {
  const data = snap.val() || {};
  if (Object.keys(data).length === 0) {
    set(ref(db, 'rooms/general'), { name: 'General' });
    set(ref(db, 'rooms/random'), { name: 'Random' });
    set(ref(db, 'rooms/gaming'), { name: 'Gaming' });
  } else {
    roomsData = data;
    renderRooms();
  }
});

function renderRooms() {
  roomsList.innerHTML = '<div class="section-label">Rooms</div>';
  Object.entries(roomsData).forEach(([id, room]) => {
    const col = getColor(room.name);
    const div = document.createElement('div');
    div.className = 'room-item' + (id === activeRoomId ? ' active' : '');
    div.innerHTML = `<div class="room-avatar" style="background:${col.fg}33;color:${col.fg}">${initials(room.name)}</div>
      <div class="room-info">
        <div class="room-name">${room.name}</div>
        <div class="room-preview">${room.lastMsg||'No messages yet'}</div>
      </div>`;
    div.addEventListener('click', () => openRoom(id, room.name));
    roomsList.appendChild(div);
  });
}

function openRoom(id, name) {
  activeRoomId = id; renderRooms();
  if (msgListenerRoom) { off(ref(db, 'messages/' + msgListenerRoom)); }
  msgListenerRoom = id;
  const col = getColor(name);
  chatArea.innerHTML = `
    <div class="chat-header">
      <div class="room-avatar-lg" style="background:${col.fg}33;color:${col.fg}">${initials(name)}</div>
      <div><div class="room-title">${name}</div><div class="room-meta">Live room</div></div>
      <span class="live-badge">● live</span>
    </div>
    <div class="messages" id="messages"></div>
    <div class="typing-row" id="typing-row"></div>
    <div class="input-area">
      <textarea id="msg-input" placeholder="Write a message… (Enter to send)" rows="1"></textarea>
      <button class="send-btn" id="send-btn" disabled><i class="ti ti-send"></i></button>
    </div>`;

  const textarea = document.getElementById('msg-input');
  const sendBtn = document.getElementById('send-btn');
  textarea.addEventListener('input', () => {
    textarea.style.height = 'auto';
    textarea.style.height = Math.min(textarea.scrollHeight, 100) + 'px';
    sendBtn.disabled = !textarea.value.trim() || !myName.trim();
    updateTyping(textarea.value.trim().length > 0);
  });
  textarea.addEventListener('keydown', e => { if (e.key==='Enter'&&!e.shiftKey){e.preventDefault();doSend();} });
  sendBtn.addEventListener('click', doSend);

  onValue(ref(db, 'messages/' + id), snap => {
    const msgs = Object.values(snap.val()||{}).sort((a,b)=>a.ts-b.ts);
    renderMessages(msgs);
    if (msgs.length>0) set(ref(db,'rooms/'+id+'/lastMsg'), msgs[msgs.length-1].sender+': '+msgs[msgs.length-1].text.slice(0,30));
  });

  onValue(ref(db, 'typing/' + id), snap => {
    const others = Object.entries(snap.val()||{}).filter(([k,v])=>k!==myName.replace(/[.#$\[\]]/g,'_')&&v).map(([k])=>k);
    const row = document.getElementById('typing-row');
    if (row) row.innerHTML = others.length ? `<span class="typing-text">${others.join(', ')} ${others.length===1?'is':'are'} typing…</span>` : '';
  });
}

let typingTimeout = null;
function updateTyping(isTyping) {
  if (!myName||!activeRoomId) return;
  const key = myName.replace(/[.#$\[\]]/g,'_');
  const tRef = ref(db,'typing/'+activeRoomId+'/'+key);
  if (isTyping) { set(tRef,true); clearTimeout(typingTimeout); typingTimeout=setTimeout(()=>set(tRef,false),3000); }
  else set(tRef,false);
}

function doSend() {
  const textarea = document.getElementById('msg-input');
  const text = textarea?.value.trim();
  if (!text||!myName.trim()) return;
  push(ref(db,'messages/'+activeRoomId),{sender:myName,text,ts:Date.now()});
  textarea.value=''; textarea.style.height='auto';
  document.getElementById('send-btn').disabled=true;
  updateTyping(false);
}

function renderMessages(msgs) {
  const container = document.getElementById('messages');
  if (!container) return;
  container.innerHTML = '';
  if (!msgs.length) { container.innerHTML='<div style="text-align:center;font-size:12px;color:#444;margin:auto">No messages yet. Say hello!</div>'; return; }
  let lastDate=null;
  msgs.forEach(msg => {
    const ds=dateStr(msg.ts);
    if (ds!==lastDate) { const d=document.createElement('div'); d.className='date-div'; d.textContent=ds; container.appendChild(d); lastDate=ds; }
    const isOwn=msg.sender===myName;
    const col=getColor(msg.sender);
    const group=document.createElement('div'); group.className='msg-group';
    const senderDiv=document.createElement('div'); senderDiv.className='msg-sender'+(isOwn?' own':''); senderDiv.textContent=msg.sender; group.appendChild(senderDiv);
    const row=document.createElement('div'); row.className='msg-row'+(isOwn?' own':'');
    if (!isOwn) { const av=document.createElement('div'); av.className='msg-avatar'; av.style.cssText=`background:${col.fg}33;color:${col.fg}`; av.textContent=initials(msg.sender); row.appendChild(av); }
    const bubble=document.createElement('div'); bubble.className='msg-bubble'+(isOwn?' own':''); bubble.textContent=msg.text; row.appendChild(bubble);
    const time=document.createElement('div'); time.className='msg-time'; time.textContent=formatTime(msg.ts); row.appendChild(time);
    if (isOwn) { const av=document.createElement('div'); av.className='msg-avatar'; av.style.cssText=`background:#534AB733;color:#7F77DD`; av.textContent=initials(msg.sender); row.appendChild(av); }
    group.appendChild(row); container.appendChild(group);
  });
  container.scrollTop=container.scrollHeight;
}

myNameInput.addEventListener('input', () => { myName=myNameInput.value.trim(); });
myNameInput.addEventListener('keydown', e => { if(e.key==='Enter'){myName=myNameInput.value.trim();myNameInput.blur();} });
addRoomBtn.addEventListener('click', ()=>{newRoomInput.value='';modal.classList.add('open');setTimeout(()=>newRoomInput.focus(),50);});
document.getElementById('modal-cancel').addEventListener('click',()=>modal.classList.remove('open'));
document.getElementById('modal-create').addEventListener('click',createRoom);
newRoomInput.addEventListener('keydown',e=>{if(e.key==='Enter')createRoom();if(e.key==='Escape')modal.classList.remove('open');});
function createRoom(){const name=newRoomInput.value.trim();if(!name)return;const id='room_'+Date.now();set(ref(db,'rooms/'+id),{name});modal.classList.remove('open');setTimeout(()=>openRoom(id,name),300);}
</script>
</body>
</html>
